<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعدي الذكي - Gemini Web</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #131314; color: #e3e3e3; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e1f20; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2c2d2e; }
        header h1 { font-size: 1.2rem; background: linear-gradient(90deg, #4285f4, #9b72cb, #d96570); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .quick-bar { display: flex; gap: 8px; padding: 10px 15px; overflow-x: auto; background: #131314; border-bottom: 1px solid #2c2d2e; }
        .chip { background: #1e1f20; color: #c4c7c5; border: 1px solid #333537; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
        .chip:hover { background: #2c2d2e; color: #fff; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; max-width: 900px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
        .msg { padding: 14px 18px; border-radius: 16px; line-height: 1.7; max-width: 88%; word-wrap: break-word; }
        .user { background: #282a2c; align-self: flex-start; border-bottom-right-radius: 4px; }
        .ai { background: transparent; align-self: flex-end; width: 100%; max-width: 100%; border-right: 3px solid #4285f4; padding-right: 16px; }
        .ai pre { background: #1e1f20; padding: 12px; border-radius: 8px; overflow-x: auto; direction: ltr; text-align: left; margin: 10px 0; border: 1px solid #333537; }
        .ai code { font-family: monospace; color: #a8c7fa; }
        .input-wrapper { background: #1e1f20; padding: 12px 16px; max-width: 900px; width: 95%; margin: 10px auto 16px; border-radius: 24px; display: flex; align-items: center; gap: 10px; border: 1px solid #333537; }
        textarea { flex: 1; background: transparent; border: none; color: #fff; font-size: 1rem; resize: none; height: 42px; outline: none; font-family: inherit; padding-top: 8px; }
        .file-label { cursor: pointer; font-size: 1.3rem; padding: 4px 8px; border-radius: 50%; }
        .file-label:hover { background: #2c2d2e; }
        button.send-btn { background: #a8c7fa; color: #062e6f; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        button.send-btn:hover { background: #d3e3fd; }
        #fileName { font-size: 0.75rem; color: #a8c7fa; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>
    <header>
        <h1>✨ Gemini AI - مساعدي الذكي</h1>
        <button class="chip" onclick="document.getElementById('chatBox').innerHTML=''">🗑️ مسح الشاشة</button>
    </header>

    <div class="quick-bar">
        <button class="chip" onclick="usePrompt('اصنع لي شجرة مهارات متشعبة من الصفر وابدأ معي أول درس في بايثون على VS Code')">🌳 المسار المتشعب والتعلم</button>
        <button class="chip" onclick="usePrompt('لدي فكرة مشروع أريد تحويلها إلى دورة تدريبية أبنيها يدوياً خطوة بخطوة: ')">🛠️ تحويل فكرة لدورة</button>
        <button class="chip" onclick="usePrompt('افحص هذا الكود أو الملف بدقة واكشف الأخطاء والثغرات الأمنية لرفعه على GitHub')">🔍 مراجعة مشروع GitHub</button>
        <button class="chip" onclick="usePrompt('لخّص لي هذا الملف الدراسي واشرح أهم النقاط فيه')">📚 تلخيص مادة</button>
    </div>

    <div class="chat-container" id="chatBox">
        <div class="msg ai">أهلاً بك! أنا مساعدك الذكي الشامل. اسألني في أي موضوع عام أو تقني، أو ارفع صوراً وملفات، أو اختر مساراً تعليمياً لنبدأ معاً!</div>
    </div>

    <div class="input-wrapper">
        <label class="file-label" title="إرفاق صورة أو ملف PDF أو كود">📎<input type="file" id="fileInput" hidden onchange="showFile()"></label>
        <span id="fileName"></span>
        <textarea id="userInput" placeholder="اسأل Gemini عن أي شيء..."></textarea>
        <button class="send-btn" onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        function usePrompt(txt) {
            const inp = document.getElementById('userInput');
            inp.value = txt;
            inp.focus();
        }
        function showFile() {
            const f = document.getElementById('fileInput').files[0];
            document.getElementById('fileName').innerText = f ? f.name : '';
        }
        async function sendMessage() {
            const inp = document.getElementById('userInput');
            const fileInp = document.getElementById('fileInput');
            const box = document.getElementById('chatBox');
            const msg = inp.value.trim();
            if (!msg && !fileInp.files.length) return;

            box.innerHTML += `<div class="msg user">${msg || '📎 تم إرفاق ملف/صورة'}</div>`;
            inp.value = '';
            const loadId = 'l-' + Date.now();
            box.innerHTML += `<div class="msg ai" id="${loadId}">✨ جاري التفكير...</div>`;
            box.scrollTop = box.scrollHeight;

            const fd = new FormData();
            fd.append('message', msg);
            if (fileInp.files.length) fd.append('file', fileInp.files[0]);

            try {
                const res = await fetch('/chat', { method: 'POST', body: fd });
                const data = await res.json();
                document.getElementById(loadId).innerHTML = marked.parse(data.reply);
            } catch (e) {
                document.getElementById(loadId).innerText = 'حدث خطأ في الاتصال بالخادم.';
            }
            fileInp.value = '';
            document.getElementById('fileName').innerText = '';
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
